name: Woche-2-Excel nach dm-Bon veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-week2-excel-dm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Excel-Datei zusammensetzen
        shell: bash
        run: |
          set -euo pipefail
          cat \
            exports/week2_b64_parts/dm_aa \
            exports/week2_b64_parts/dm_ab \
            exports/week2_b64_parts/dm_ac \
            exports/week2_b64_parts/dm_ad \
            exports/week2_b64_parts/dm_ae \
            > exports/Urlaubskasse_Woche2_aktuell.xlsx.b64
          base64 --decode exports/Urlaubskasse_Woche2_aktuell.xlsx.b64 > exports/Urlaubskasse_Woche2.xlsx
          test "$(stat -c%s exports/Urlaubskasse_Woche2.xlsx)" -gt 10000

      - name: Aktualisierten Export speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/Urlaubskasse_Woche2_aktuell.xlsx.b64 exports/Urlaubskasse_Woche2.xlsx
          git diff --cached --quiet || git commit -m "Excel-Export Woche 2 nach dm-Bon aktualisieren"
          git push
