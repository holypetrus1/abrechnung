name: Apply Excel update for Netto receipt
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-excel-netto.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode workbook
        run: base64 -d exports/Urlaubskasse_Woche1.xlsx.b64 > exports/Urlaubskasse_Woche1.xlsx
      - name: Commit workbook and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm exports/Urlaubskasse_Woche1.xlsx.b64
          git rm -f exports/Urlaubskasse_Woche1.xlsx.tmp scripts/update_excel_netto_notice.txt
          git rm .github/workflows/apply-excel-netto.yml
          git add exports/Urlaubskasse_Woche1.xlsx
          git commit -m "Excel-Export nach Netto-Bon aktualisieren"
          git push
